<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:;" />
  <title>My Torrent</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="app">

    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-group">
        <button id="btn-add-magnet" class="icon-btn" title="Thêm Magnet Link" aria-label="Thêm Magnet">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M13 11h6v2h-6v6h-2v-6H5v-2h6V5h2v6z"/></svg>
        </button>
        <button id="btn-add-torrent" class="icon-btn" title="Thêm file .torrent" aria-label="Thêm .torrent">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 2 5 5h-5V4zM8 13h8v2H8v-2zm0 4h5v2H8v-2z"/></svg>
        </button>
      </div>
      <div class="topbar-sep"></div>
      <div class="topbar-group">
        <button id="btn-resume" class="icon-btn" title="Tiếp tục" aria-label="Play">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="btn-pause" class="icon-btn" title="Tạm dừng" aria-label="Pause">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>
        </button>
        <button id="btn-remove" class="icon-btn icon-btn-danger" title="Xóa torrent" aria-label="Delete">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 7h12v2H6V7zm2 3h8l-1 10H9L8 10zm3-6h2v2h-2V4z"/></svg>
        </button>
      </div>
      <div class="topbar-spacer"></div>
      <div class="topbar-group">
        <input id="search-input" type="search" class="search-input" placeholder="Lọc torrent…" />
        <button id="btn-settings" class="icon-btn" title="Cài đặt" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 8a4 4 0 1 0 .001 8.001A4 4 0 0 0 12 8zm8.94 4a7.96 7.96 0 0 0-.12-1l2.03-1.58-1.92-3.32-2.39.96a8.06 8.06 0 0 0-1.73-1l-.36-2.54H9.75l-.36 2.54a8.06 8.06 0 0 0-1.73 1l-2.39-.96-1.92 3.32L3.18 11a7.96 7.96 0 0 0 0 2l-2.03 1.58 1.92 3.32 2.39-.96c.52.4 1.1.73 1.73 1l.36 2.54h4.5l.36-2.54c.63-.27 1.21-.6 1.73-1l2.39.96 1.92-3.32L20.82 13c.08-.33.12-.66.12-1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Body: Sidebar + Main -->
    <div class="body">

      <aside class="sidebar">
        <nav class="sidebar-nav">
          <button class="sidebar-item active" data-filter="all">
            <span class="sidebar-icon">📋</span> Tất cả
            <span class="sidebar-count" data-count="all">0</span>
          </button>
          <button class="sidebar-item" data-filter="downloading">
            <span class="sidebar-icon">⬇</span> Đang tải
            <span class="sidebar-count" data-count="downloading">0</span>
          </button>
          <button class="sidebar-item" data-filter="done">
            <span class="sidebar-icon">✓</span> Đã xong
            <span class="sidebar-count" data-count="done">0</span>
          </button>
          <button class="sidebar-item" data-filter="seeding">
            <span class="sidebar-icon">⬆</span> Đang Seed
            <span class="sidebar-count" data-count="seeding">0</span>
          </button>
          <button class="sidebar-item" data-filter="paused">
            <span class="sidebar-icon">⏸</span> Đã tạm dừng
            <span class="sidebar-count" data-count="paused">0</span>
          </button>
        </nav>
      </aside>

      <div class="main-column">

        <!-- Torrent Table -->
        <div class="table-panel">
          <table id="torrent-table" class="torrent-table">
            <thead>
              <tr>
                <th class="col-name">Tên</th>
                <th class="col-size">Dung lượng</th>
                <th class="col-progress">Tiến độ</th>
                <th class="col-status">Trạng thái</th>
                <th class="col-down">Tốc độ tải</th>
                <th class="col-up">Tốc độ Up</th>
                <th class="col-peers">Peer</th>
                <th class="col-eta">ETA</th>
              </tr>
            </thead>
            <tbody id="torrent-tbody"></tbody>
          </table>
          <div id="empty-state" class="empty-state hidden">
            <p class="empty-title">Chưa có torrent nào</p>
            <p class="empty-hint">Nhấn <strong>+</strong> hoặc <strong>📄</strong> trên thanh công cụ để bắt đầu</p>
          </div>
        </div>

        <!-- Bottom Panel -->
        <div id="bottom-panel" class="bottom-panel">
          <div class="bottom-tabs">
            <button class="bottom-tab active" data-tab="files">Tệp tin</button>
            <button class="bottom-tab" data-tab="general">Thông tin</button>
          </div>
          <div class="bottom-content">
            <div id="tab-files" class="tab-pane active">
              <div id="file-tree-status" class="file-tree-status"></div>
              <div id="file-tree" class="file-tree"></div>
            </div>
            <div id="tab-general" class="tab-pane">
              <dl id="torrent-info" class="torrent-info"></dl>
            </div>
          </div>
        </div>

        <div id="panel-resizer" class="panel-resizer" title="Kéo để thay đổi kích thước"></div>
      </div>
    </div>

    <!-- Status Bar -->
    <footer class="statusbar">
      <span id="global-down">↓ 0 B/s</span>
      <span id="global-up">↑ 0 B/s</span>
      <span id="status-label" class="statusbar-label">0 torrent</span>
      <span id="global-peers" class="statusbar-right">Peers: 0</span>
    </footer>
  </div>

  <!-- Dialog: dán magnet link -->
  <dialog id="magnet-dialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h2 class="dialog-title">Dán Magnet Link</h2>
      <input id="magnet-input" type="text" class="dialog-input" placeholder="magnet:?xt=urn:btih:…" required />
      <div class="dialog-actions">
        <button type="button" id="magnet-cancel" class="btn btn-secondary">Hủy</button>
        <button type="submit" value="confirm" class="btn btn-primary">Tiếp tục</button>
      </div>
    </form>
  </dialog>

  <!-- Dialog: chọn thư mục lưu trước khi tải -->
  <dialog id="add-torrent-dialog" class="dialog">
    <form method="dialog" class="dialog-body dialog-wide">
      <h2 class="dialog-title">Thêm Torrent</h2>

      <div class="form-group">
        <label class="form-label">Nguồn</label>
        <p id="add-source-preview" class="source-preview"></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="add-download-path">Lưu vào thư mục</label>
        <div class="folder-row">
          <input id="add-download-path" type="text" class="dialog-input folder-input" readonly placeholder="Chọn thư mục…" />
          <button type="button" id="add-browse-btn" class="btn btn-secondary">Chọn…</button>
        </div>
      </div>

      <div class="dialog-actions">
        <button type="button" id="add-cancel-btn" class="btn btn-secondary">Hủy</button>
        <button type="submit" value="confirm" class="btn btn-primary">Bắt đầu tải</button>
      </div>
    </form>
  </dialog>

  <!-- Context menu torrent -->
  <div id="torrent-context-menu" class="context-menu hidden" role="menu">
    <button type="button" class="context-menu-item" data-action="resume">▶ Tiếp tục</button>
    <button type="button" class="context-menu-item" data-action="pause">⏸ Tạm dừng</button>
    <button type="button" class="context-menu-item" data-action="stop">⏹ Dừng</button>
    <div class="context-menu-sep"></div>
    <button type="button" class="context-menu-item" data-action="open-folder">📂 Mở thư mục</button>
    <div class="context-menu-sep"></div>
    <button type="button" class="context-menu-item context-menu-danger" data-action="delete">✕ Xóa torrent</button>
  </div>

  <script src="js/renderer.js"></script>
</body>
</html>
