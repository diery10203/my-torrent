# https://www.electron.build/configuration

appId: com.mytorrent.app
productName: My Torrent
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: assets

files:
  - src/**/*
  - package.json
  - "!**/*.map"
  - "!**/node_modules/**/{CHANGELOG.md,README.md,readme.md,readme,test,__tests__,tests,powered-test,example,examples,*.d.ts}"

asar: true
asarUnpack:
  - "**/*.node"

# WebTorrent optional native deps (bufferutil…) — bỏ qua rebuild để build ổn định
npmRebuild: false
buildDependenciesFromSource: false

# ── Protocol & file associations ─────────────────────────────────────────────
protocols:
  - name: BitTorrent Magnet
    schemes:
      - magnet

fileAssociations:
  - ext: torrent
    name: BitTorrent File
    description: BitTorrent torrent file
    role: Editor
    mimeType: application/x-bittorrent

# ── macOS ──────────────────────────────────────────────────────────────────────
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: assets/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  darkModeSupport: true

dmg:
  # Tên volume phải khác nhau giữa x64/arm64 — build song song sẽ lỗi hdiutil nếu trùng
  title: "MyTorrent-${version}-${arch}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ── Windows ────────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: assets/icon.png
  publisherName: My Torrent

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: My Torrent

# ── Publish (optional — uncomment when ready) ──────────────────────────────────
# publish:
#   provider: github
#   owner: your-username
#   repo: my-torrent
